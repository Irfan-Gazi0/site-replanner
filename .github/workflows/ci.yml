# Free tests only: no ROS on the runner (nothing under mvp/agents, mvp/eval or
# mvp/tests imports rclpy) and no API key, so the `live` marker is deselected.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m "not live" -q
